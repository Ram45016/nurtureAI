
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NurtureAI</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Android Native Integration -->
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NurtureAI">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Quicksand', sans-serif;
        background-color: #fdfdff;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: contain;
        overflow: hidden; /* App container handles scrolling */
      }
      .safe-area-bottom {
        padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 0px;
      }
      .app-container {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .scroll-container {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 100px; /* Space for bottom nav */
        -webkit-overflow-scrolling: touch;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script>
      let deferredPrompt;
      
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Guardian Active'))
            .catch(err => console.error('Guardian Offline', err));
        });
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-installable', { detail: true }));
      });

      window.triggerInstall = async () => {
        if (!deferredPrompt) {
          alert("NurtureAI is optimized for your device! To install:\n\n1. Open Chrome Menu (⋮)\n2. Select 'Install app' or 'Add to Home screen'");
          return;
        }
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
      };
    </script>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
