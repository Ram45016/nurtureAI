
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NurtureAI</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Android Native Integration (Material Design 3 Theme) -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="NurtureAI">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
      }
      body {
        font-family: 'Quicksand', sans-serif;
        background-color: #f8fafc; /* Slate-50 Android Background */
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: contain;
        overflow: hidden; 
        color: #1e293b;
      }
      .safe-area-top {
        padding-top: max(1rem, var(--safe-top));
      }
      .safe-area-bottom {
        padding-bottom: max(0.5rem, var(--safe-bottom));
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 0px;
        display: none;
      }
      .app-container {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .scroll-container {
        flex: 1;
        overflow-y: auto;
        padding-bottom: 120px; /* Space for MD3 Nav Bar */
        -webkit-overflow-scrolling: touch;
      }
      /* MD3 Elevation Effects */
      .md3-card {
        box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        transition: box-shadow 0.2s;
      }
      .md3-card:active {
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script>
      let deferredPrompt;
      
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const base = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
          const swUrl = base + 'sw.js';
          
          try {
            const swOrigin = new URL(swUrl).origin;
            if (swOrigin === window.location.origin) {
              navigator.serviceWorker.register(swUrl)
                .then(reg => console.log('Guardian Active'))
                .catch(err => console.error('Guardian Offline', err));
            }
          } catch (e) {
            console.error('Service Worker registration skipped', e);
          }
        });
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-installable', { detail: true }));
      });

      window.addEventListener('appinstalled', (e) => {
        console.log('NurtureAI installed as Native WebAPK');
        window.dispatchEvent(new CustomEvent('pwa-installed', { detail: true }));
      });

      window.triggerInstall = async () => {
        if (!deferredPrompt) {
          alert("NurtureAI Download Guide:\n\n1. Tap the three dots (⋮) in the top-right corner.\n2. Select 'Install app' or 'Add to Home screen'.\n\nThis will download the native WebAPK to your Android device.");
          return;
        }
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          deferredPrompt = null;
          window.dispatchEvent(new CustomEvent('pwa-installable', { detail: false }));
        }
      };
    </script>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
