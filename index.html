
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NurtureAI</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Android Native Integration -->
    <meta name="theme-color" content="#f8fafc">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --md-sys-color-surface: #f8fafc;
        --md-sys-color-on-surface: #1e293b;
        --safe-top: env(safe-area-inset-top);
        --safe-bottom: env(safe-area-inset-bottom);
      }
      body {
        font-family: 'Quicksand', sans-serif;
        background-color: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
        overflow: hidden; 
        margin: 0;
        padding: 0;
      }
      .android-scroll {
        height: 100vh;
        overflow-y: auto;
        padding-top: calc(80px + var(--safe-top)); /* Top bar space */
        padding-bottom: calc(90px + var(--safe-bottom)); /* Bottom nav space */
        scrollbar-width: none;
      }
      .android-scroll::-webkit-scrollbar {
        display: none;
      }
      /* MD3 Elevation Levels */
      .elevation-1 { box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1); }
      .elevation-2 { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1); }
      .elevation-3 { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1); }
      
      /* Active state ripples simulation */
      .md3-clickable:active {
        background-color: rgba(0, 0, 0, 0.05);
        transform: scale(0.98);
        transition: all 0.1s ease;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
